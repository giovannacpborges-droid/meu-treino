function renderOrientacoes(){document.getElementById("orientacoes").innerHTML=`<div class="section-title"><h2>Orientações</h2><span class="badge">Fonte: seus planos</span></div><details class="accordion" open><summary>Como funciona o ciclo de musculação</summary><div class="inside">Os exercícios permanecem ao longo das 12 semanas; mudam séries, repetições, carga e descanso. São 3 fases de 4 semanas.</div></details><details class="accordion"><summary>F1 — Base · semanas 1–4</summary><div class="inside">Objetivo: aprender técnica, adaptar articulações e tendões e encontrar cargas. Descanso de 60 s. Termine a série sentindo que conseguiria mais 3 repetições.</div></details><details class="accordion"><summary>F2 — Construção · semanas 5–8</summary><div class="inside">Objetivo: ganho muscular. 90 s nos exercícios com 4 séries e 60 s nos demais. Termine sentindo que conseguiria mais 1–2 repetições.</div></details><details class="accordion"><summary>F3 — Força e definição · semanas 9–12</summary><div class="inside">Mais força e intensidade. 2 min nos exercícios com 4 séries e 30–45 s nos demais. Termine sentindo que conseguiria mais 1 repetição. Onde houver PAUSA, segure 2 s na parte mais difícil.</div></details><details class="accordion"><summary>Progressão de carga</summary><div class="inside">Semana 1: encontre a carga que permita o mínimo de repetições com boa técnica. Semana 2: mesma carga, tente chegar ao máximo. Semana 3: se atingir o máximo em todas as séries, aumente a carga. Semana 4: recuperação, 2 séries por exercício com a carga da semana 1.</div></details><details class="accordion"><summary>Corrida — fases</summary><div class="inside">F1 Base (1–4): aumentar frequência e distância. F2 Velocidade (5–8): tiros fortes com pausa. F3 Ritmo (9–12): trechos moderados mais longos e finais progressivos nos longões.</div></details><details class="accordion"><summary>Ritmos de referência</summary><div class="inside">Leve: 7:45–8:15/km. Moderado: 6:55–7:05/km. Forte: 6:15–6:30/km. Meta do ciclo: 5 km em 30–31 min, pace 6:05–6:12/km e cerca de 30 km/semana.</div></details><details class="accordion"><summary>Testes de 5 km</summary><div class="inside">Aquecer 1 km leve e correr 5 km no máximo, tentando manter o ritmo do início ao fim. A partir do pace do teste: leve = +1:10 a +1:40; moderado = +0:20 a +0:30; forte = −0:20 a −0:05.</div></details><details class="accordion"><summary>GPS e exportação</summary><div class="inside">O GPS desta versão usa a localização do navegador. A qualidade depende do aparelho, permissão, sinal e economia de bateria. O app calcula distância a partir dos pontos recebidos e permite baixar o trajeto em GPX. Isso não substitui um relógio dedicado para precisão de treino.</div></details>`}

 overlay.innerHTML=`<div style="max-width:620px;width:100%;background:#fffaf7;border:1px solid #decfd6;border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(50,35,45,.2)"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#80586d;font-weight:800">Compartilhar treino</div><h3 style="margin:5px 0;color:#493b46">Escolha o formato</h3></div><button class="ghost" id="closeShare">Fechar</button></div><div class="grid3" style="margin-top:15px"><button class="card" id="shareComplete" style="text-align:left;border:1px solid #decfd6"><b>Completo</b><div class="small" style="margin-top:6px">Exercícios, séries, pesos e volume.</div></button><button class="card" id="shareClean" style="text-align:left;border:1px solid #decfd6"><b>Clean</b><div class="small" style="margin-top:6px">Transparente, só o essencial.</div></button><button class="card" id="shareStory" style="text-align:left;border:1px solid #decfd6"><b>Story</b><div class="small" style="margin-top:6px">Formato vertical para compartilhar.</div></button></div></div>`;document.body.appendChild(overlay);document.getElementById("closeShare").onclick=()=>overlay.remove();document.getElementById("shareComplete").onclick=()=>{downloadOrShareCanvas(drawCompleteWorkout(d),`treino-completo-${d}.png`);overlay.remove();toast("Imagem completa baixada")};document.getElementById("shareClean").onclick=()=>{downloadOrShareCanvas(drawCleanWorkout(d),`treino-clean-${d}.png`);overlay.remove();toast("Imagem clean transparente baixada")};document.getElementById("shareStory").onclick=()=>{downloadOrShareCanvas(drawStoryWorkout(d),`treino-story-${d}.png`);overlay.remove();toast("Imagem Story baixada")};overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.remove()})
}
